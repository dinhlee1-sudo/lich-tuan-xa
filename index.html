        body {
            box-sizing: border-box;
        }
        * {
            font-family: 'Be Vietnam Pro', sans-serif;
        }
        
        /* Màu nền cho từng ngày trong tuần */
        .day-monday { background-color: #fef3c7; }
        .day-tuesday { background-color: #dbeafe; }
        .day-wednesday { background-color: #dcfce7; }
        .day-thursday { background-color: #fce7f3; }
        .day-friday { background-color: #e0e7ff; }
        .day-saturday { background-color: #fed7aa; }
        .day-sunday { background-color: #fecaca; }
        
        /* Highlight ngày hiện tại */
        .today-row {
            background-color: #fef08a !important;
            font-weight: 700;
            position: relative;
        }
        .today-row::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: linear-gradient(180deg, #f59e0b, #d97706);
        }
        
        /* Animation cho header */
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        
        .header-badge {
            animation: pulse-subtle 3s ease-in-out infinite;
        }
        
        /* Table styling */
        .schedule-table {
            border-collapse: separate;
            border-spacing: 0;
        }
        
        .schedule-table th {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .schedule-table td, .schedule-table th {
            border: 2px solid #374151;
        }
        
        /* Organization section styling */
        .org-section {
            page-break-inside: avoid;
        }
        
        .org-header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            padding: 1.5rem;
            border-radius: 0.75rem 0.75rem 0 0;
        }

        .org-badge {
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 0.5rem;
            background: white;
            padding: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        /* Desktop optimizations - Better text sizing */
        @media (min-width: 769px) {
            body {
                font-size: 16px;
            }
            
            .schedule-table td, .schedule-table th {
                font-size: 15px;
                line-height: 1.5;
                padding: 16px 12px;
            }
            
            h1 {
                font-size: 2rem;
                line-height: 1.2;
            }
            
            h2 {
                font-size: 1.75rem;
                line-height: 1.3;
            }

            .org-badge {
                width: 4.5rem;
                height: 4.5rem;
            }
        }
        
        /* Large desktop optimizations */
        @media (min-width: 1280px) {
            .schedule-table td, .schedule-table th {
                font-size: 16px;
                padding: 18px 16px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            h2 {
                font-size: 2rem;
            }

            .org-badge {
                width: 5rem;
                height: 5rem;
            }
        }
        
        /* Responsive text sizes for TV/Large screens */
        @media (min-width: 1920px) {
            .tv-title { font-size: 3rem; }
            .tv-subtitle { font-size: 1.75rem; }
            .tv-table-header { font-size: 1.5rem; }
            .tv-table-cell { font-size: 1.35rem; }
            
            .schedule-table td, .schedule-table th {
                font-size: 18px;
                padding: 20px 18px;
            }

            .org-badge {
                width: 6rem;
                height: 6rem;
            }
        }
        
        /* Mobile optimizations */
        @media (max-width: 768px) {
            .mobile-card {
                border-left: 4px solid #3b82f6;
                margin-bottom: 1rem;
            }
            .mobile-card.today-card {
                border-left-color: #f59e0b;
                background: linear-gradient(to right, #fef08a, #fefce8);
            }
            .hide-mobile {
                display: none;
            }
            .mobile-scroll {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            
            /* Better text sizing on mobile */
            body {
                font-size: 16px;
            }
            
            h1, h2, h3 {
                line-height: 1.3;
            }
            
            .mobile-card {
                font-size: 15px;
            }
            
            .mobile-card .font-bold {
                font-size: 17px;
            }
            
            /* Prevent text from being too small */
            * {
                -webkit-text-size-adjust: 100%;
                text-size-adjust: 100%;
            }

            .org-badge {
                width: 2.5rem;
                height: 2.5rem;
            }
        }

        /* Delete confirmation overlay */
        .delete-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 60;

            padding: 1.5rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
    </style>

        async function loadDataFromServer() {
            try {
                const response = await fetch(API_URL, { method: "GET", cache: "no-store" });
                if (!response.ok) throw new Error("Không thể kết nối máy chủ");
                const data = await response.json();
                if (data && data.ok && data.data && data.data.scheduleDataByOrg) {
                    scheduleDataByOrg = data.data.scheduleDataByOrg;
                }
            } catch (error) {
                console.error("Lỗi tải dữ liệu từ máy chủ:", error);
                showNotification("⚠️ Không tải được dữ liệu máy chủ. Đang dùng dữ liệu hiện có.", true);
            }
        }

        async function saveDataToServer() {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ scheduleDataByOrg })
            });
            if (!response.ok) throw new Error("Không thể lưu dữ liệu lên máy chủ");
            const result = await response.json();
            if (!result.ok) throw new Error(result.error || "Máy chủ từ chối lưu dữ liệu");
            return result;

        // Utility functions
        function getISOWeek(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        function getWeekDates(date) {
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(date);
            monday.setDate(diff);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            return { monday, sunday };
        }

        function formatDate(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function getDayName(date) {
            const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            return days[date.getDay()];
        }

        function getDayClass(date) {
            const dayIndex = date.getDay();
            const classes = {
                0: 'day-sunday',
                1: 'day-monday',
                2: 'day-tuesday',
                3: 'day-wednesday',
                4: 'day-thursday',
                5: 'day-friday',
                6: 'day-saturday'
            };
            return classes[dayIndex];
        }

        function isToday(dateString) {
            const today = new Date();
            const compareDate = new Date(dateString);
            return today.toDateString() === compareDate.toDateString();
        }

        function parseDate(dateString) {
            return new Date(dateString + 'T00:00:00');
        }

                    `<div class="w-20 h-20 mx-auto rounded-lg overflow-hidden shadow-lg"><img src="${org.iconUrl}" alt="${org.name}" loading="lazy" onerror="this.style.display='none'" class="w-full h-full object-contain"></div>` : 
                    `<div class="w-20 h-20 mx-auto rounded-lg flex items-center justify-center text-white text-4xl font-bold" style="background: ${org.color}">${org.name.charAt(0)}</div>`;
                
                html = `
                    <div class="text-center py-12 md:py-16 text-gray-500">
                        ${displayIcon}
                        <p class="text-lg md:text-xl font-semibold mt-4">${org.name}</p>
                        <p class="mt-2 text-sm md:text-base">Chưa có lịch công tác</p>
                        <p class="mt-1 text-sm md:text-base">Nhấn "Thêm Công Tác Mới" để bắt đầu</p>
                    </div>
                `;
            }

            editList.innerHTML = html;
            
            // Add event listeners for all schedule fields
            document.querySelectorAll('.schedule-field').forEach(element => {
                element.addEventListener('change', (e) => {
                    const index = parseInt(e.target.dataset.index);
                    const field = e.target.dataset.field;
                    const value = e.target.value;
                    updateScheduleItem(index, field, value);
                });
            });
        }

        function updateScheduleItem(index, field, value) {
            scheduleDataByOrg[currentEditOrg][index][field] = value;
        }

        function showDeleteConfirmation(index) {
            deleteIndex = index;
            const item = scheduleDataByOrg[currentEditOrg][index];
            const dateObj = parseDate(item.date);
            const org = organizations.find(o => o.id === currentEditOrg);
            const overlay = document.getElementById('delete-overlay');
            const infoDiv = document.getElementById('delete-item-info');
            
            const displayIcon = org.iconUrl ? 
                `<div class="w-8 h-8 rounded overflow-hidden"><img src="${org.iconUrl}" alt="${org.name}" loading="lazy" onerror="this.style.display='none'" class="w-full h-full object-contain"></div>` : 
                `<div class="w-8 h-8 rounded flex items-center justify-center text-white text-sm font-bold" style="background: ${org.color}">${org.name.charAt(0)}</div>`;
            
            infoDiv.innerHTML = `
                <div class="flex items-center gap-2 mb-2">
                    ${displayIcon}
                    <span class="font-bold text-gray-700">${org.name}</span>
                </div>
                <div class="font-bold text-gray-800 mb-1">${getDayName(dateObj)}, ${formatDate(dateObj)}</div>
                <div class="text-gray-600 text-sm mb-1">${item.startTime} - ${item.endTime}</div>
                <div class="text-gray-700">${item.content}</div>
            `;
            
            overlay.classList.remove('hidden');
        }

        function hideDeleteConfirmation() {
            document.getElementById('delete-overlay').classList.add('hidden');
            deleteIndex = -1;
        }

        function confirmDelete() {
            if (deleteIndex >= 0) {
                scheduleDataByOrg[currentEditOrg].splice(deleteIndex, 1);
                renderEditList();
                showNotification('🗑️ Đã xóa công tác');
            }
            hideDeleteConfirmation();
        }

        function addNewScheduleItem() {
            const today = new Date();
            const dateStr = today.toISOString().split('T')[0];
            
            const newItem = {
                date: dateStr,
                startTime: "08:00",
                endTime: "10:00",
                content: "Nội dung công tác mới",
                location: "Địa điểm",
                participants: "Thành phần tham gia"
            };
            
            if (!scheduleDataByOrg[currentEditOrg]) {
                scheduleDataByOrg[currentEditOrg] = [];
            }
            
            scheduleDataByOrg[currentEditOrg].push(newItem);
            renderEditList();
            
            const editList = document.getElementById('edit-list');
            setTimeout(() => {
                editList.scrollTop = editList.scrollHeight;
            }, 100);
        }

        async function saveChanges() {
            const saveButton = document.getElementById('save-changes');
            const oldText = saveButton ? saveButton.textContent : '';
            try {
                if (saveButton) {
                    saveButton.disabled = true;
                    saveButton.textContent = '⏳ Đang lưu...';
                }
                await saveDataToServer();
                renderAllSchedules();
                toggleEditMode();
                showNotification('✅ Đã lưu dữ liệu lên máy chủ!');
            } catch (error) {
                console.error(error);
                showNotification('❌ Lưu dữ liệu thất bại: ' + error.message, true);
            } finally {
                if (saveButton) {
                    saveButton.disabled = false;
                    saveButton.textContent = oldText || '💾 Lưu Thay Đổi';
                }
            }
        }

        function cancelEdit() {
            toggleEditMode();
        }

        function showNotification(message, isError = false) {
            const notification = document.createElement('div');
            notification.className = `fixed top-20 right-4 ${isError ? 'bg-red-600' : 'bg-green-600'} text-white px-6 py-4 rounded-lg shadow-xl z-50 font-bold text-lg animate-bounce`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Event listeners
        document.getElementById('toggle-edit-mode').addEventListener('click', toggleEditMode);
        document.getElementById('close-edit-panel').addEventListener('click', toggleEditMode);
        document.getElementById('add-new-btn').addEventListener('click', addNewScheduleItem);
        document.getElementById('save-changes').addEventListener('click', saveChanges);
        document.getElementById('cancel-edit').addEventListener('click', cancelEdit);
        document.getElementById('cancel-delete').addEventListener('click', hideDeleteConfirmation);
        document.getElementById('confirm-delete').addEventListener('click', confirmDelete);

        // Make functions global
        window.updateScheduleItem = updateScheduleItem;
        window.showDeleteConfirmation = showDeleteConfirmation;

        // Initialize
        async function init() {
            if (window.elementSdk) {
                await window.elementSdk.init({
                    defaultConfig,
                    onConfigChange,
                    mapToCapabilities,
                    mapToEditPanelValues
                });
            } else {
                onConfigChange(defaultConfig);
            }

            await loadDataFromServer();
            renderAllSchedules();
        }

        init();
    </script>
